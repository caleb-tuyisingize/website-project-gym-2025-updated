<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
  

    <title>Website project template</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

</head>
<body class=" bg-bg-primary font-outfit overflow-x-hidden">

    

    <div  id="navbar" class="sticky top-0 bg-transparent z-100 max-xl:mb-50"></div>
    <div class="" id="header"></div>
    <div  id="hero"></div>
    <div id="shape" class="sticky -top-6"></div>
    <div id="services"></div>
    
    <div id="contact"></div>
    <div id="footer"></div>
    <script defer src="/src/js/nav.js"></script>
    <script>
        const loadComponents = (id, url) =>  {
            return fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = async () => {
            // load navbar first so scripts can attach
            await loadComponents('navbar', 'src/sections/navBar.html');
            // init nav handlers that expect elements inside the injected navbar
            if (window.initNav) window.initNav();

            // load the rest (can be async)
            loadComponents('header', 'src/sections/header.html');
            loadComponents('hero', 'src/sections/hero.html');
            loadComponents('services', 'src/sections/service.html');
            loadComponents('shape', 'src/sections/shape.html');
            loadComponents('contact', 'src/sections/contact.html');
            loadComponents('footer', 'src/sections/footer.html');
           loadComponents('data_privacy','src/sections/dataprivacy.html')

        }
    </script>

     
    </body>

</html>
